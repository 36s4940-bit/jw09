<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청소년 봉사활동 탐험센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--g:#8CCB2F;--gd:#3F7A12;--bg:#F1F9E4;--ink:#22301A;--y:#FACC15;--k:#1E293B;--pink:#FFB6D5;--line:#CFE8A6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#dcefc0 2px,transparent 2px) 0 0/26px 26px;min-height:100vh;padding:16px}
h1,h2,h3,.jua{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400}
.app{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;justify-content:center;margin:4px 0 14px}
header img{height:46px}header h1{font-size:1.6rem;color:var(--gd)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps button{flex:1;border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 4px;font:inherit;font-size:.82rem;font-weight:700;color:#7a8f66;cursor:default}
.steps button.done{cursor:pointer;color:var(--gd);border-color:var(--g)}
.steps button.on{background:var(--g);border-color:var(--g);color:#fff}
.stage{background:#fff;border:3px solid var(--g);border-radius:26px;padding:22px;box-shadow:0 6px 0 var(--line)}
.guide{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.guide img{height:150px;flex:none;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.guide img{animation:none}}
.bubble{position:relative;background:#F7FCEB;border:3px solid var(--g);border-radius:20px;padding:14px 18px;font-size:1.15rem;line-height:1.5;margin-bottom:22px}
.bubble:before{content:"";position:absolute;left:-12px;bottom:14px;width:18px;height:18px;background:#F7FCEB;border-left:3px solid var(--g);border-bottom:3px solid var(--g);transform:rotate(45deg)}
.bubble small{display:block;font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:.85rem;color:#5d7050;margin-top:4px}
.badtz .bubble{border-color:var(--k);background:#F4F6F9}.badtz .bubble:before{background:#F4F6F9;border-color:var(--k)}
label{display:block;font-weight:800;margin-bottom:6px;color:var(--gd)}
select{width:100%;padding:13px;border:3px solid var(--line);border-radius:14px;font:inherit;font-size:1rem;background:#fff}
select:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:16px 10px;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;color:var(--ink)}
.opt small{display:block;font-weight:500;font-size:.8rem;color:#667;margin-top:3px}
.opt.sel{background:var(--k);border-color:var(--k);color:#fff}.opt.sel small{color:#cbd5e1}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:14px 26px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn.sub{background:#e9efe0;color:#4b5b3c;box-shadow:0 4px 0 #cdd8bd}.btn:disabled{opacity:.45;cursor:not-allowed}
.cal{max-width:420px;margin:0 auto}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h h3{font-size:1.3rem;color:var(--gd)}.cal-h button{width:40px;height:40px;border-radius:50%;border:2px solid var(--g);background:#fff;font-size:1.1rem;cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.dow{font-size:.8rem;font-weight:800;color:#789}.dow:first-child{color:#e55}
.day{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:none;font:inherit;font-size:.95rem;color:#b5beac;cursor:default;position:relative}
.day.has{background:#E4F6BF;border-color:var(--g);color:var(--gd);font-weight:800;cursor:pointer}
.day.has:after{content:"";position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--g)}
.day.sel{background:var(--gd);border-color:var(--gd);color:#fff}.day.sel:after{background:var(--y)}
.legend{font-size:.82rem;color:#5d7050;text-align:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;min-height:30px}
.chip{background:var(--k);color:#fff;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sum button{border:2px solid var(--g);background:#F7FCEB;border-radius:99px;padding:6px 14px;font:inherit;font-size:.85rem;font-weight:700;color:var(--gd);cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.tab{border:2px solid var(--k);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer}
.tab.on{background:var(--k);color:#fff}
.cat{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:1.35rem;color:var(--gd)}
.cat span{background:var(--y);color:var(--k);font:800 .8rem 'Pretendard',sans-serif;border-radius:99px;padding:2px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{border:3px solid var(--line);border-radius:18px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.card h4{font-size:1.05rem;line-height:1.35}
.badge{display:inline-block;font-size:.72rem;font-weight:800;border-radius:7px;padding:3px 8px;margin-right:4px}
.b1{background:#DCFCE7;color:#15803D}.b2{background:#FEF9C3;color:#854D0E}.b3{background:#EEF1F5;color:#475569}
.info{font-size:.86rem;line-height:1.7;color:#3b4a33}.info b{color:var(--gd)}
.more{margin-top:auto;border:2px solid var(--k);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:800;cursor:pointer}
.more:hover{background:var(--k);color:#fff}
.empty{text-align:center;padding:10px 0}.empty h3{font-size:1.3rem;margin-bottom:8px}
dialog{border:4px solid var(--g);border-radius:22px;padding:22px;width:min(92vw,480px);margin:auto}
dialog::backdrop{background:#0006}dialog h3{font-size:1.3rem;margin:8px 0 12px}
dialog dl{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;font-size:.93rem}dialog dt{font-weight:800;color:var(--gd)}
@media(max-width:600px){.row{grid-template-columns:1fr}.guide img{height:110px}.stage{padding:16px}.steps button{font-size:.72rem}header h1{font-size:1.2rem}.bubble{font-size:1rem}}
/* ===== [신규] 한영외고 맞춤 봉사활동 추천 ===== */
.promo{display:flex;align-items:center;gap:16px;background:var(--k);color:#fff;border:3px solid var(--k);border-radius:26px;padding:18px 22px;margin-bottom:14px;box-shadow:0 6px 0 #0f172a33}
.promo img{height:96px;flex:none}
.promo h2{font-size:1.45rem;color:var(--y);margin-bottom:4px;line-height:1.3}
.promo p{font-size:.98rem;margin-bottom:12px;color:#e2e8f0}
.btn.y{background:var(--y);color:var(--k);box-shadow:0 4px 0 #ca9f0a}
.btn.a{display:inline-block;text-decoration:none}
.rec-sec{margin-bottom:22px}
.rec-sec label small{font-weight:500;color:#667;margin-left:8px;font-size:.8rem}
.ropts{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.ropts .opt{padding:12px 8px;font-size:.95rem}
.score{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--gd)}
.score i{flex:1;height:10px;background:#E4F6BF;border-radius:99px;overflow:hidden}
.score u{display:block;height:100%;background:var(--g);border-radius:99px}
.why{background:#F7FCEB;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.55}
.why ul{margin:4px 0 0 16px;padding:0}.why li.w{color:#92400e}
.note{font-size:.78rem;color:#7a5b00;background:#FFF7D6;border-radius:8px;padding:6px 8px;line-height:1.45}
.notice{background:#FFFBEA;border:2px dashed var(--y);border-radius:14px;padding:10px 14px;font-size:.85rem;line-height:1.7;margin:10px 0}
.b4{background:#FFE4F0;color:#9D2162}.b5{background:#1E293B;color:#fff}
a.more{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.rcard .more+.more{margin-top:0}
@media(max-width:600px){.promo{flex-direction:column;text-align:center;padding:16px}.promo img{height:80px}.promo h2{font-size:1.2rem}.ropts{grid-template-columns:1fr 1fr}}
</style>
</head>

/* 3. 날짜 */
function availDates(){return uniq(dataset.filter(i=>match(i,false)).map(i=>i.date)).sort()}
function initCal(){
  const a=availDates();if(!a.length)return;
  S.dates=new Set([...S.dates].filter(d=>a.includes(d)));
  const f=new Date((S.dates.size?[...S.dates].sort()[0]:a[0])+'T00:00:00');S.y=f.getFullYear();S.m=f.getMonth();
}
function r3(){
  const a=new Set(availDates());
  const first=new Date(S.y,S.m,1).getDay(),last=new Date(S.y,S.m+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=last;d++){
    const s=`${S.y}-${String(S.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=a.has(s)?`<button class="day has ${S.dates.has(s)?'sel':''}" aria-pressed="${S.dates.has(s)}" onclick="togDate('${s}')">${d}</button>`:`<div class="day">${d}</div>`;
  }
  const sel=[...S.dates].sort();
  $('stage').innerHTML=guide(KERO,'kero','언제 봉사하러 갈래? 🐸','초록색으로 표시된 날에 봉사활동이 있어. 여러 날을 골라도 돼!')+
  (a.size?`<div class="cal"><div class="cal-h"><button aria-label="이전 달" onclick="mv(-1)">◀</button><h3>${S.y}년 ${S.m+1}월</h3><button aria-label="다음 달" onclick="mv(1)">▶</button></div>

  <div class="chips">${sel.length?sel.map(d=>`<span class="chip">${fmt(d)}</span>`).join(''):'<span class="legend">선택한 날짜가 없으면 모든 날짜를 보여줘요</span>'}</div>`
  :`<div class="empty"><h3>앗, 이 조건에는 봉사활동이 없어요 🐸</h3><p>지역이나 참가 대상을 바꿔 볼까요?</p></div>`)+`
  <div class="nav"><button class="btn sub" onclick="go(1)">◀ 이전</button><span>${sel.length?`<button class="btn sub" onclick="S.dates.clear();r3()">선택 초기화</button> `:''}<button class="btn" ${a.size?'':'disabled'} onclick="S.cat='전체';go(3)">${sel.length?`${sel.length}일 선택 · `:'날짜 상관없이 '}결과 보기 ▶</button></span></div>`;
}
function togDate(s){S.dates.has(s)?S.dates.delete(s):S.dates.add(s);r3()}
function mv(d){S.m+=d;if(S.m>11){S.m=0;S.y++}if(S.m<0){S.m=11;S.y--}r3()}

function realPool(){

  return dataset.filter(i=>i.date>=today&&targetsOf(i).includes('고')).map(i=>{
    const sgg=sggOf(i),seoul=i.sido==='서울특별시';
    const loc=seoul?(sgg==='강동구'?'gd':NEAR_GU.includes(sgg)?'nr':'se'):(NEAR_GU.includes(sgg)?'nr':'fr');
    const d=new Date(i.date+'T00:00:00'),wk=d.getDay(),hr=parseInt(timeOf(i),10),mo=d.getMonth()+1,times=[];
    if(wk===0||wk===6)times.push('we');else if(hr>=15)times.push('wd');
    if([1,2,7,8].includes(mo))times.push('vac');
    const cap=capOf(i);
    return {id:'real'+i.key,real:true,name:i.pgmNm,fields:REAL_FIELD[i.category]||[],cat:i.category,langs:[],isLang:0,pri:0,loc,times,modes:null,

  });
}

/* ---------- 적합도 점수 ---------- */
function scoreItem(it){
  const p={},why=[],warn=[];
  // ① 관심 분야 (35)
  const ints=[...R.int];
  if(!ints.length)p.int=.8;
  else{
    let best=0;const hit=[];
    ints.forEach(f=>{const k=it.fields.indexOf(f);if(k===0){best=Math.max(best,1);hit.push(f)}else if(k>0){best=Math.max(best,.65);hit.push(f)}});
    p.int=best;
    hit.length?why.push(`관심 분야(${hit.map(f=>lbl('int',f)).join('·')})에 해당하는 활동이에요`):warn.push('선택한 관심 분야와는 직접 연결되지 않아요');
  }
  // ② 외국어 (25)
  const L=[...R.lang];
  if(!L.length)p.lang=.8;
  else if(L.includes('none')){
    p.lang=it.isLang?0:1;
    it.isLang?warn.push('외국어 특화 활동이라 희망과는 달라요'):why.push('외국어 특화가 아닌 활동이라 희망 조건에 잘 맞아요');
  }else{
    const m=L.filter(l=>it.langs.includes(l));
    if(m.length){p.lang=1;why.push(`자신 있는 외국어(${m.map(l=>lbl('lang',l)).join('·')})를 직접 활용할 수 있어요`)}
    else if(!it.langs.length)p.lang=.4;
    else{p.lang=.15;warn.push('이 활동에서 주로 쓰는 외국어는 선택한 언어와 달라요')}
  }
  // ③ 장소 (15) — 선택한 장소와 전혀 안 맞으면 제외
  const places=[...R.loc];
  p.loc=places.length?Math.max(...places.map(k=>LOCM[k][it.loc])):LOC_NEUTRAL[it.loc];
  if(places.length&&p.loc===0)return null;
  if(p.loc>=.8&&LOC_WHY[it.loc]&&(places.length||it.loc==='gd'||it.loc==='nr'))why.push(LOC_WHY[it.loc]);
  else if(places.length&&p.loc<.8)warn.push(`장소(${LOC_TXT[it.loc]})는 희망 장소에서 조금 떨어져 있어요`);
  // ④ 시간 (15)
  const T=[...R.time].filter(x=>x!=='any');
  if(!T.length)p.time=R.time.has('any')?1:.8;
  else{
    const m=T.filter(t=>it.times.includes(t));
    p.time=m.length?1:.25;
    m.length?why.push(`가능한 시간(${m.map(t=>lbl('time',t)).join('·')})에 참여할 수 있어요`):warn.push('선택한 활동 가능 시간과는 달라요');
  }
  // ⑤ 참여 방식 (10)
  if(!R.mode||R.mode==='any')p.mode=R.mode?1:.8;
  else if(!it.modes)p.mode=.7;
  else if(it.modes.includes(R.mode)){p.mode=1;why.push(`'${lbl('mode',R.mode)}' 방식으로 참여하기 좋아요`)}
  else{p.mode=.3;warn.push('선택한 참여 방식과는 달라요')}
  // 한영외고 특화 가산점 (최대 +6) — 외국어 특화 비선호 시 없음, 다른 관심 분야 선택 시에는 관련 활동에만 크게 적용
  let bonus=0;
  if(it.pri&&!L.includes('none')){
    bonus=(!ints.length||p.int>0)?6:2;
    why.unshift('한영외고의 외국어 교육 특성을 살릴 수 있는 활동 유형이에요');
  }
  const total=Math.min(100,Math.round(Object.keys(W).reduce((s,k)=>s+W[k]*p[k],0)+bonus));
  if(!why.length)why.push('선택한 조건과 크게 어긋나지 않는 활동이에요');
  return {it,total,why,warn};
}
/* 상위 6개 안에 외국어 특화 활동이 3개를 넘지 않도록 조정(다른 관심 분야를 고른 경우) */
function diversify(sorted){
  const nonLang=[...R.int].some(f=>f!=='intl'&&f!=='trans');
  if(!nonLang)return sorted;
  const out=[],rest=[];let lc=0;
  for(const x of sorted){
    if(x.it.isLang&&lc>=3&&out.length<6)rest.push(x);
    else{out.push(x);if(x.it.isLang)lc++}
  }
  const top=out.slice(0,6);
  for(const x of rest){if(top.length>=6)break;top.push(x)}
  top.sort((a,b)=>b.total-a.total);
  return top.concat(sorted.filter(x=>!top.includes(x)));
}
function computeRec(){
  const pool=EX.concat(realPool());
  const list=pool.map(scoreItem).filter(Boolean).sort((a,b)=>b.total-a.total||(b.it.real-a.it.real));
  list.forEach(x=>RES[x.it.id]=x);
  return list;
}

function recPick(b){
  const g=b.dataset.g,k=b.dataset.k;
  if(g==='mode')R.mode=R.mode===k?'':k;
  else{
    const s=R[g],ex=g==='lang'?'none':(g==='loc'||g==='time')?'any':null;
    if(s.has(k))s.delete(k);
    else{
      if(ex&&k===ex)s.clear();
      else if(ex)s.delete(ex);
      s.add(k);
    }
  }
  document.querySelectorAll('.ropts .opt').forEach(x=>{const on=isSel(x.dataset.g,x.dataset.k);x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on)});
}

function recResults(){
  const all=computeRec();
  const nReal=all.filter(x=>x.it.real).length,nEx=all.length-nReal;
  const f=R.filter==='real'?all.filter(x=>x.it.real):R.filter==='ex'?all.filter(x=>!x.it.real):all;
  const list=diversify(f);
  const shown=R.more?list:list.slice(0,6);
  const tab=(k,t,n)=>`<button class="tab ${R.filter===k?'on':''}" onclick="R.filter='${k}';R.more=false;recResults()">${t} ${n}</button>`;
  $('stage').innerHTML=recTop()+(all.length
    ?guide(BADTZ,'badtz',`...조건에 맞는 활동 ${all.length}개를 찾았어.`,'적합도가 높은 순서야. 신청 전에 꼭 공식 정보를 확인해.')
    :guide(BADTZ,'badtz','...딱 맞는 활동이 없어.','장소나 시간 조건을 조금 넓혀서 다시 찾아보자.'))+recSummary()+
  `<div class="notice"><b>데이터 안내</b><br><span class="badge b1">실제 모집 데이터</span> 이 사이트에 등록된 모집 정보 중 오늘 이후에 열리는 고등학생 대상 활동이에요.<br><span class="badge b4">예시 데이터</span> 추천 방식을 보여 주기 위한 활동 유형이에요. 실제 모집 공고가 아니며 일정·봉사시간·신청 링크는 없어요.</div>`+
  (all.length?`<div class="tabs">${tab('all','전체',all.length)}${tab('real','실제 모집 데이터',nReal)}${tab('ex','예시 데이터',nEx)}</div>`:'')+
  (shown.length?`<div class="cards">${shown.map(rcard).join('')}</div>`
    :`<div class="empty"><h3>이 구분에는 추천할 활동이 없어요</h3><p>${R.filter==='real'?'지금 등록된 실제 모집 중 조건에 맞는 활동이 없어요. 예시 데이터나 기존 검색(1365 데이터)도 확인해 보세요.':'조건을 수정해 다시 추천받아 보세요.'}</p></div>`)+
  (list.length>6&&!R.more?`<div class="nav"><span></span><button class="btn sub" onclick="R.more=true;recResults()">추천 활동 더 보기 (${list.length-6}개) ▼</button><span></span></div>`:'')+
  `<div class="nav"><button class="btn sub" onclick="recEdit()">◀ 조건 수정하기</button><span><button class="btn sub" onclick="recFull()">처음부터 다시</button> <button class="btn" onclick="recExit()">기존 검색으로</button></span></div>`;
}
function recDetail(id){
  const x=RES[id];if(!x)return;const it=x.it;
  $('dlg').innerHTML=`<img src="${KERO}" alt="" height="70"><h3>${it.name}</h3><p class="note" style="margin-bottom:10px">${it.real?'실제 모집 데이터 (이 사이트에 등록된 정보)':'예시 데이터 — 실제 모집 공고가 아니에요'}</p><dl>
  <dt>분야</dt><dd>${rfields(it)}</dd><dt>활동 내용</dt><dd>${it.content}</dd>${it.organ?`<dt>운영기관</dt><dd>${it.organ}</dd>`:''}
  <dt>활동장소</dt><dd>${it.place}</dd><dt>시간·일정</dt><dd>${it.sched}</dd>${it.cap?`<dt>모집인원</dt><dd>${it.cap}</dd>`:''}${it.hours?`<dt>봉사시간</dt><dd>${it.hours}</dd>`:''}${it.real?`<dt>인증</dt><dd>${it.certified==='Y'?'국가인증 터전':'일반 터전'}</dd><dt>데이터 번호</dt><dd>${it.key}</dd>`:''}
  <dt>적합도</dt><dd>${x.total}점</dd><dt>추천 이유</dt><dd>${x.why.concat(x.warn).map(w=>'· '+w).join('<br>')}</dd></dl>
  <p class="note" style="margin-top:12px">${it.url?'아래 버튼으로 공식 모집 페이지에서 신청할 수 있어요.':(it.real?'이 활동의 1365 공식 모집 링크는 확인되지 않았어요. 1365 자원봉사포털에서 활동명·운영기관으로 검색해 신청 가능 여부와 봉사시간을 꼭 확인해 주세요.':'실제 모집 일정·봉사시간·신청 방법은 1365 자원봉사포털에서 비슷한 활동을 검색해 확인해 주세요.')}</p>
  <div class="nav"><button class="btn sub" onclick="$('dlg').close()">닫기</button><a class="btn a" href="${it.url||PORTAL_URL}" target="_blank" rel="noopener">${it.url?'1365 공식 모집 페이지':'1365 자원봉사포털 열기'}</a></div>`;
  $('dlg').showModal();
}

render();
</script>
</body>
</html>
